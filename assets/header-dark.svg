<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-labelledby="t">
  <title id="t">Cameron Reimer — GRC Information Security Analyst, CISSP, builder</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .muted { fill: #8b949e; }
    .text { fill: #e6edf3; }
    .label { font-size: 11px; letter-spacing: 2px; }
    .value { font-size: 13px; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  </style>

  <rect x="0.5" y="0.5" width="879" height="249" rx="12" fill="#0d1117" stroke="#30363d"/>

  <text x="36" y="42" class="mono muted label">CONTROL RECORD</text>
  <text x="844" y="42" class="mono muted label" text-anchor="end">CR-808</text>
  <line x1="36" y1="60" x2="844" y2="60" stroke="#30363d"/>

  <text x="36" y="112" class="sans text" font-size="34" font-weight="600">Cameron Reimer</text>
  <text x="36" y="142" class="sans muted" font-size="15">GRC Information Security Analyst · CISSP · Builder</text>

  <g transform="rotate(-6 752 112)">
    <rect x="664" y="84" width="176" height="56" rx="6" fill="none" stroke="#3fb950" stroke-width="2"/>
    <circle cx="686" cy="106" r="5" fill="#3fb950" class="pulse"/>
    <text x="700" y="112" class="mono" font-size="17" font-weight="700" letter-spacing="3" fill="#3fb950">EFFECTIVE</text>
    <text x="752" y="130" class="mono" font-size="10" fill="#3fb950" text-anchor="middle" opacity=".8">no exceptions noted</text>
  </g>

  <line x1="36" y1="172" x2="844" y2="172" stroke="#30363d" stroke-dasharray="3 5"/>

  <text x="36" y="200" class="mono muted label">OWNER</text>
  <text x="36" y="222" class="mono text value">creimer808</text>

  <text x="250" y="200" class="mono muted label">SCOPE</text>
  <text x="250" y="222" class="mono text value">PCI-DSS · SOC 2 · vendor risk</text>

  <text x="560" y="200" class="mono muted label">BUILDING</text>
  <text x="560" y="222" class="mono value" fill="#58a6ff">breachday.io · vigilus.dev</text>
</svg>
